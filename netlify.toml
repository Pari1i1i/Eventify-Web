[build]
  command = "npm run build"
  publish = "dist"

# 1. Reverse Proxy ke API VPS Golang untuk menghindari Mixed Content (HTTPS -> HTTP) & CORS di Netlify
[[redirects]]
  from = "/api/v1/*"
  to = "http://139.190.96.203:8093/api/v1/:splat"
  status = 200
  force = true

# 2. Routing fallback untuk React Router (Single Page Application / SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
